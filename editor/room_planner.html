<title>Room Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: blueprint workbench. Left rail = rooms + room settings, centre = top-down plan canvas,
   right rail = the selected marker. Stacks to one column on phones. */
:root {
  --bg: #eef0f6; --panel: #ffffff; --ink: #1d2236; --muted: #5d6482; --line: #d6dae8; --grid: #dfe3ef; --grid-major: #c5cbe0;
  --floor: #f7f8fc; --accent: #5b4bd6; --accent-ink: #ffffff; --danger: #c03d4f; --focus: #8b7cf0;
  --k-decoration: #2f9e6f; --k-furniture: #a26a2c; --k-npc: #2f74d0; --k-enemy: #d0413e; --k-item: #b38a00;
  --k-door: #7a4fd0; --k-spawn: #0f8a9d; --k-camera: #3b3f58; --k-area: #2f9e9e; --k-path: #8a6d3b; --k-note: #8a8fa8;
  --font-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12131c; --panel: #1b1d2a; --ink: #e7e8f3; --muted: #a2a6c0; --line: #2e3145; --grid: #232637; --grid-major: #33374e;
  --floor: #171925; --accent: #9d8cff; --accent-ink: #16131f; --danger: #ff7a8a; --focus: #b4a7ff;
  --k-decoration: #4cc995; --k-furniture: #d79a57; --k-npc: #63a4ff; --k-enemy: #ff6b67; --k-item: #e2bd3b;
  --k-door: #b08cff; --k-spawn: #3cc6d9; --k-camera: #c9cce0; --k-area: #4cc9c9; --k-path: #c9a46a; --k-note: #9aa0bd; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12131c; --panel: #1b1d2a; --ink: #e7e8f3; --muted: #a2a6c0; --line: #2e3145; --grid: #232637; --grid-major: #33374e;
  --floor: #171925; --accent: #9d8cff; --accent-ink: #16131f; --danger: #ff7a8a; --focus: #b4a7ff;
  --k-decoration: #4cc995; --k-furniture: #d79a57; --k-npc: #63a4ff; --k-enemy: #ff6b67; --k-item: #e2bd3b;
  --k-door: #b08cff; --k-spawn: #3cc6d9; --k-camera: #c9cce0; --k-area: #4cc9c9; --k-path: #c9a46a; --k-note: #9aa0bd; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 20px }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance }
h1 { font-size: 20px; letter-spacing: -.01em }
h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); font-weight: 600 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums }

header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px }
header.top .sub { color: var(--muted); font-size: 13px }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block }
.status.ok i { background: var(--k-decoration) } .status.busy i { background: var(--k-item) } .status.err i { background: var(--danger) }

.work { display: grid; grid-template-columns: 260px minmax(0, 1fr) 280px; gap: 12px; align-items: start }
@media (max-width: 1100px) { .work { grid-template-columns: 240px minmax(0, 1fr) } .inspector { grid-column: 1 / -1 } }
@media (max-width: 720px) { .work { grid-template-columns: minmax(0, 1fr) } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field label, .lbl { font-size: 12px; color: var(--muted) }
input[type=text], input[type=number], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; min-width: 0 }
textarea { resize: vertical; min-height: 64px }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap } .row > * { flex: 1 1 0; min-width: 0 }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 10px; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600 }
.btn.danger { color: var(--danger) } .btn.danger.armed { background: var(--danger); color: var(--panel); border-color: var(--danger) }
.btn.small { padding: 3px 8px; font-size: 12px }

.rooms { display: flex; flex-direction: column; gap: 4px }
.room-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; border: 1px solid transparent; background: none; text-align: left; width: 100% }
.room-item:hover { border-color: var(--line) } .room-item.on { border-color: var(--accent); background: var(--bg) }
.room-item .meta { font-size: 11px; color: var(--muted) }

.stage { display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.tools { display: flex; flex-wrap: wrap; gap: 6px }
.tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 13px }
.tool .chip { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 10px/1 var(--font-mono); color: var(--panel) }
.tool kbd { font: 11px var(--font-mono); color: var(--muted) }
.tool.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
.canvas-wrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; touch-action: none }
canvas#plan { display: block; width: 100%; height: auto; cursor: crosshair }
.hint { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px }
.hint b { color: var(--ink); font-weight: 500 }

.inspector .empty { color: var(--muted); font-size: 13px }
.kind-badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600 }
.kind-badge .chip { width: 12px; height: 12px; border-radius: 50% }
.dial { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px }
.dial button { height: 30px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font: 11px var(--font-mono) }
.dial button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.dial span { display: grid; place-items: center; font: 10px var(--font-mono); color: var(--muted) }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden }
.seg button { border: 0; background: var(--panel); padding: 4px 10px; font-size: 12px } .seg button + button { border-left: 1px solid var(--line) }
.seg button.on { background: var(--accent); color: var(--accent-ink) }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); width: min(760px, calc(100vw - 32px)); padding: 16px }
dialog::backdrop { background: rgb(0 0 0 / .45) }
dialog .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px }
dialog textarea { min-height: 50vh; font: 12px/1.5 var(--font-mono) }
.note { font-size: 12px; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header class="top">
  <div>
    <h1>Room Planner</h1>
    <div class="sub">Lay out rooms with text markers. Claude turns each marker into real props, characters and cameras.</div>
  </div>
  <div class="row" style="flex:0 1 auto;align-items:center">
    <span class="status" id="status"><i></i><span>Starting…</span></span>
    <button class="btn primary" id="briefBtn">Brief for Claude</button>
  </div>
</header>

<div class="work">
  <!-- left: project + room settings -->
  <aside class="panel" aria-label="Rooms">
    <div class="row" style="align-items:center"><h2>Rooms</h2><button class="btn small" id="addRoom" style="flex:0 0 auto">+ New room</button></div>
    <div class="rooms" id="roomList"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:2px 0;width:100%">
    <h2>This room</h2>
    <div class="field"><label for="rName">Name</label><input type="text" id="rName"></div>
    <div class="field"><label for="rPreset">Size</label>
      <select id="rPreset"></select></div>
    <div class="row" id="customSize">
      <div class="field"><label for="rW">Width (east–west)</label><input type="number" id="rW" min="32" max="400" step="8"></div>
      <div class="field"><label for="rD">Depth (north–south)</label><input type="number" id="rD" min="32" max="400" step="8"></div>
    </div>
    <div class="row">
      <div class="field"><label for="rSetting">Setting</label><select id="rSetting"><option value="interior">Indoors</option><option value="exterior">Outdoors</option></select></div>
      <div class="field"><label for="rBound">Edges</label><select id="rBound"><option value="walls">Walls</option><option value="fence">Fence</option><option value="trees">Trees / hedges</option><option value="open">Open</option></select></div>
    </div>
    <div class="field"><label for="rFloor">Floor</label><input type="text" id="rFloor" placeholder="e.g. wooden planks, mossy flagstones"></div>
    <div class="field"><label for="rNotes">Mood and notes for Claude</label><textarea id="rNotes" placeholder="e.g. Cosy but cluttered. Candlelight. The camera should feel like peeking in from a corner."></textarea></div>
    <button class="btn danger" id="delRoom">Delete room</button>
  </aside>

  <!-- centre: tools + plan -->
  <section class="stage" aria-label="Plan">
    <div class="tools" id="tools"></div>
    <div class="canvas-wrap"><canvas id="plan" width="900" height="620" tabindex="0" aria-label="Top-down room plan"></canvas></div>
    <div class="hint" id="hint"></div>
  </section>

  <!-- right: selected marker -->
  <aside class="panel inspector" id="inspector" aria-label="Selected marker"></aside>
</div>

<dialog id="briefDlg">
  <div class="bar">
    <h2 style="font-size:14px">Brief for Claude</h2>
    <div class="row" style="flex:0 1 auto;align-items:center">
      <div class="seg" id="briefScope"><button data-s="room" class="on">This room</button><button data-s="all">All rooms</button></div>
      <div class="seg" id="briefFmt"><button data-f="text" class="on">Readable</button><button data-f="json">JSON</button></div>
    </div>
  </div>
  <p class="note" id="briefNote"></p>
  <textarea id="briefText" readonly></textarea>
  <div class="bar" style="margin:10px 0 0">
    <div class="row" style="flex:0 1 auto">
      <button class="btn" id="exportBtn">Save file</button>
      <label class="btn" for="importFile" style="cursor:pointer">Load file</label>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <div class="row" style="flex:0 1 auto">
      <button class="btn primary" id="copyBtn">Copy</button>
      <button class="btn" id="closeBrief">Close</button>
    </div>
  </div>
</dialog>

<script>
(() => {
'use strict';
// ------------------------------------------------------------ vocabulary
// Units are the game's base units (rooms.py): the witch stands about 35 tall and 14 wide.
// Facing: 0 = south (toward the bottom of the plan / the default camera), 90 = west, 180 = north, 270 = east.
const KINDS = {
  decoration: { name: 'Decoration', key: '1', glyph: 'D', hint: 'Pumpkin, vase, hanging herbs' },
  furniture:  { name: 'Furniture',  key: '2', glyph: 'F', hint: 'Table, bookshelf, bed' },
  npc:        { name: 'NPC',        key: '3', glyph: 'N', hint: 'Wizard, shopkeeper' },
  enemy:      { name: 'Enemy',      key: '4', glyph: 'E', hint: 'Slime, bat swarm' },
  item:       { name: 'Interactable', key: '5', glyph: 'I', hint: 'Chest, lever, spellbook' },
  door:       { name: 'Door / exit', key: '6', glyph: '⇥', hint: 'Snaps to the nearest edge' },
  spawn:      { name: 'Player start', key: '7', glyph: 'S', hint: 'Where she appears' },
  camera:     { name: 'Camera',     key: '8', glyph: 'C', hint: 'Place it, then aim it' },
  area:       { name: 'Area',       key: '9', glyph: 'A', hint: 'Drag: rug, pond, camera zone' },
  path:       { name: 'Path',       key: '0', glyph: 'P', hint: 'Click points, double-click to end' },
  note:       { name: 'Note',       key: 'n', glyph: '?', hint: 'Anything else for Claude' },
};
const SIZES = { S: 'Small', M: 'Medium', L: 'Large' };
const RADIUS = { S: 3.5, M: 5.5, L: 8.5 };            // rough footprint radius, in units
const PRESETS = [
  // sized for the 1920x1080 game view (rooms were enlarged 1.25x for it)
  { id: 'closet', name: 'Closet · 80 × 60', w: 80, d: 60 },
  { id: 'small', name: 'Small room · 120 × 90', w: 120, d: 90 },
  { id: 'cottage', name: 'Cottage room · 140 × 105', w: 140, d: 105 },
  { id: 'medium', name: 'Medium · 160 × 120', w: 160, d: 120 },
  { id: 'large', name: 'Large · 220 × 150', w: 220, d: 150 },
  { id: 'hall', name: 'Long hall · 280 × 120', w: 280, d: 120 },
  { id: 'yard', name: 'Courtyard · 260 × 200', w: 260, d: 200 },
  { id: 'bigfield', name: 'Big field · 280 × 190', w: 280, d: 190 },
  { id: 'meadow', name: 'Wide meadow · 320 × 220', w: 320, d: 220 },
  { id: 'openfield', name: 'Open field · 350 × 240', w: 350, d: 240 },
  { id: 'custom', name: 'Custom…', w: 0, d: 0 },
];
const DIRS = [['NW', 135], ['N', 180], ['NE', 225], ['W', 90], null, ['E', 270], ['SW', 45], ['S', 0], ['SE', 315]];
const dirName = f => ['S', 'SW', 'W', 'NW', 'N', 'NE', 'E', 'SE'][Math.round((((f % 360) + 360) % 360) / 45) % 8];
const HEIGHTS = { low: 26, medium: 32, high: 38 };

const $ = id => document.getElementById(id);
const cv = $('plan'), ctx = cv.getContext('2d');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const uid = () => Math.random().toString(36).slice(2, 9);
const slug = s => (s || 'room').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'room';

// ------------------------------------------------------------ state
let rooms = {};               // id -> room
let current = null, sel = null, tool = 'select', draft = null, drag = null;
let db = null, mode = 'local';
const dirty = new Set();      // rooms with unsaved edits
const writing = new Set();
const timers = {};

function newRoom(name) {
  let id = slug(name), n = 2;
  while (rooms[id]) id = slug(name) + '-' + n++;
  return { id, name, preset: 'medium', size: [128, 96], setting: 'interior', boundary: 'walls', floor: '', notes: '', markers: [], updated: Date.now() };
}
const room = () => rooms[current];
const marker = () => room() && room().markers.find(m => m.id === sel);

// ------------------------------------------------------------ storage: shared db when available, else this browser
function setStatus(kind, text) { const s = $('status'); s.className = 'status ' + kind; s.lastElementChild.textContent = text; }
function saveLocal() { try { localStorage.setItem('roomPlanner.v1', JSON.stringify({ rooms, current })); } catch (e) {} }
function loadLocal() { try { const v = JSON.parse(localStorage.getItem('roomPlanner.v1') || 'null'); if (v && v.rooms) { rooms = v.rooms; current = v.current; } } catch (e) {} }

function touch(r = room()) {
  if (!r) return;
  r.updated = Date.now();
  saveLocal();
  if (mode !== 'db') { setStatus('ok', 'Saved in this browser'); return; }
  dirty.add(r.id); setStatus('busy', 'Saving…');
  clearTimeout(timers[r.id]); timers[r.id] = setTimeout(() => flush(r.id), 700);
}
async function flush(id) {
  if (writing.has(id) || !rooms[id]) return;
  writing.add(id); dirty.delete(id);
  try { await db.collection('rooms').doc(id).set(JSON.parse(JSON.stringify(rooms[id]))); setStatus('ok', 'Saved · Claude can read it'); }
  catch (e) {
    if (e && e.code === 'invalid_argument') { setStatus('err', 'You can view these rooms but not change them'); }
    else if (e && e.code === 'quota_exceeded') { setStatus('err', 'Storage is full. Delete unused rooms.'); }
    else { dirty.add(id); setStatus('err', 'Not saved yet. Will retry.'); setTimeout(() => flush(id), 3000); }
  } finally { writing.delete(id); if (dirty.has(id)) flush(id); }
}
async function removeRoom(id) {
  delete rooms[id]; saveLocal();
  if (mode === 'db') { try { await db.collection('rooms').doc(id).delete(); } catch (e) { setStatus('err', 'Could not delete from shared storage'); } }
}

async function connect() {
  let api = null;
  try { api = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { api = null; }
  if (!api) { mode = 'local'; setStatus('ok', 'Saving in this browser'); if (!Object.keys(rooms).length) seedBlank(); renderAll(); return; }
  db = api; mode = 'db'; setStatus('busy', 'Loading rooms…');
  const timer = setTimeout(() => setStatus('err', 'Shared rooms can’t be reached yet'), 10000);
  db.collection('rooms').onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    const seen = {};
    for (const d of snap.docs) {
      const r = d.data(); seen[d.id] = true;
      if (!dirty.has(d.id) && !writing.has(d.id)) rooms[d.id] = JSON.parse(JSON.stringify(r));
    }
    for (const id of Object.keys(rooms)) if (!seen[id] && !dirty.has(id) && !writing.has(id) && !snap.metadata.fromCache && !pendingNew.has(id)) delete rooms[id];
    if (!Object.keys(rooms).length && !snap.metadata.fromCache) seedBlank();
    if (!rooms[current]) current = Object.keys(rooms)[0] || null;
    if (!snap.metadata.fromCache) setStatus('ok', 'Synced · Claude can read these rooms');
    renderAll();
  }, e => { clearTimeout(timer); setStatus('err', 'Shared storage stopped. Changes stay in this browser.'); mode = 'local'; });
}
const pendingNew = new Set();
function seedBlank() { const r = newRoom('First room'); rooms[r.id] = r; current = r.id; pendingNew.add(r.id); }

// ------------------------------------------------------------ geometry: plan view fitted into the canvas
let view = { s: 4, ox: 40, oy: 40 };
function fit() {
  const r = room(); if (!r) return;
  const wrap = cv.parentElement, W = Math.max(320, wrap.clientWidth), dpr = Math.min(2, window.devicePixelRatio || 1);
  const aspect = r.size[1] / r.size[0], H = Math.round(Math.min(Math.max(W * aspect + 110, 300), 780));
  cv.style.height = H + 'px'; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const pad = 46, s = Math.min((W - pad * 2) / r.size[0], (H - pad * 2 - 20) / r.size[1]);
  view = { s: s * dpr, ox: (W - r.size[0] * s) / 2 * dpr, oy: ((H - 20 - r.size[1] * s) / 2) * dpr, dpr };
}
const toScreen = (x, z) => [view.ox + x * view.s, view.oy + z * view.s];
function toWorld(e) {
  const b = cv.getBoundingClientRect(), dpr = view.dpr;
  return [((e.clientX - b.left) * dpr - view.ox) / view.s, ((e.clientY - b.top) * dpr - view.oy) / view.s];
}
const snap = v => Math.round(v / 2) * 2;
const clampIn = (x, z) => { const r = room(); return [Math.max(0, Math.min(r.size[0], x)), Math.max(0, Math.min(r.size[1], z))]; };
function edgeSnap(x, z) {                     // doors live on the nearest edge
  const [W, D] = room().size, d = { N: z, S: D - z, W: x, E: W - x };
  const edge = Object.keys(d).sort((a, b) => d[a] - d[b])[0];
  return edge === 'N' ? { edge, x: snap(x), z: 0 } : edge === 'S' ? { edge, x: snap(x), z: D } : edge === 'W' ? { edge, x: 0, z: snap(z) } : { edge, x: W, z: snap(z) };
}

// ------------------------------------------------------------ drawing
function drawPlan() {
  const r = room(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  if (!r) return;
  const s = view.s, dpr = view.dpr, [W, D] = r.size;
  const [x0, y0] = toScreen(0, 0);
  ctx.fillStyle = css('--floor'); ctx.fillRect(x0, y0, W * s, D * s);
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 8) { ctx.strokeStyle = x % 16 ? css('--grid') : css('--grid-major'); ctx.beginPath(); ctx.moveTo(x0 + x * s + .5, y0); ctx.lineTo(x0 + x * s + .5, y0 + D * s); ctx.stroke(); }
  for (let z = 0; z <= D; z += 8) { ctx.strokeStyle = z % 16 ? css('--grid') : css('--grid-major'); ctx.beginPath(); ctx.moveTo(x0, y0 + z * s + .5); ctx.lineTo(x0 + W * s, y0 + z * s + .5); ctx.stroke(); }
  // edges
  ctx.strokeStyle = css('--ink'); ctx.lineWidth = r.boundary === 'walls' ? 4 * dpr : 2 * dpr;
  ctx.setLineDash(r.boundary === 'fence' ? [6 * dpr, 4 * dpr] : r.boundary === 'trees' ? [2 * dpr, 5 * dpr] : r.boundary === 'open' ? [1 * dpr, 9 * dpr] : []);
  ctx.strokeRect(x0, y0, W * s, D * s); ctx.setLineDash([]);
  // compass + scale
  ctx.fillStyle = css('--muted'); ctx.font = `${11 * dpr}px ${css('--font-mono')}`; ctx.textAlign = 'center';
  ctx.fillText('N', x0 + W * s / 2, y0 - 12 * dpr); ctx.fillText('S', x0 + W * s / 2, y0 + D * s + 20 * dpr);
  ctx.textAlign = 'right'; ctx.fillText('W', x0 - 8 * dpr, y0 + D * s / 2 + 4 * dpr); ctx.textAlign = 'left'; ctx.fillText('E', x0 + W * s + 8 * dpr, y0 + D * s / 2 + 4 * dpr);
  // witch footprint for scale, then the caption

  if ($('mWidth')) { $('mWidth').value = m.width || (m.kind === 'path' ? 10 : 12); $('mWidth').oninput = e => { m.width = +e.target.value || m.width; touch(); drawPlan(); }; }
  if ($('mW')) { $('mW').value = m.w; $('mD').value = m.d; $('mW').oninput = e => { m.w = Math.max(4, +e.target.value || 4); touch(); drawPlan(); }; $('mD').oninput = e => { m.d = Math.max(4, +e.target.value || 4); touch(); drawPlan(); }; }
  for (const [id, key] of [['mSize', 'size'], ['mHeight', 'height']]) if ($(id)) $(id).querySelectorAll('button').forEach(b => b.onclick = () => { m[key] = b.dataset.v; touch(); renderInspector(); drawPlan(); });
  if ($('mDial')) $('mDial').querySelectorAll('button').forEach(b => b.onclick = () => { m.face = +b.dataset.v; touch(); renderInspector(); drawPlan(); });
  if ($('mHasFace')) $('mHasFace').onchange = e => { m.face = e.target.checked ? 0 : null; touch(); renderInspector(); drawPlan(); };
  $('mDel').onclick = deleteMarker;
  $('mDup').onclick = () => { const c = JSON.parse(JSON.stringify(m)); c.id = uid(); if (c.points) c.points = c.points.map(p => [p[0] + 8, p[1] + 8]); else if (c.kind !== 'door') { c.x += 8; c.z += 8; } room().markers.push(c); sel = c.id; touch(); renderAll(); };
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function renderAll() { renderRooms(); renderRoomForm(); fit(); drawPlan(); renderInspector(); }

// room form wiring
$('rPreset').innerHTML = PRESETS.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
$('rName').oninput = e => { room().name = e.target.value; touch(); renderRooms(); drawPlan(); };
$('rPreset').onchange = e => { const r = room(), p = PRESETS.find(p => p.id === e.target.value); r.preset = p.id; if (p.w) r.size = [p.w, p.d]; clampAll(); touch(); renderAll(); };
for (const [id, i] of [['rW', 0], ['rD', 1]]) $(id).onchange = e => { const r = room(); r.size[i] = Math.max(32, Math.min(400, Math.round(+e.target.value / 2) * 2 || r.size[i])); clampAll(); touch(); renderAll(); };
$('rSetting').onchange = e => { room().setting = e.target.value; touch(); };
$('rBound').onchange = e => { room().boundary = e.target.value; touch(); drawPlan(); };
$('rFloor').oninput = e => { room().floor = e.target.value; touch(); };
$('rNotes').oninput = e => { room().notes = e.target.value; touch(); };
function clampAll() { const r = room(); for (const m of r.markers) { if (m.kind === 'door') Object.assign(m, edgeSnap(...clampIn(m.x, m.z))); else if (m.points) m.points = m.points.map(p => clampIn(...p)); else if (m.x != null) [m.x, m.z] = clampIn(m.x, m.z); } }
$('addRoom').onclick = () => { const r = newRoom('New room ' + (Object.keys(rooms).length + 1)); rooms[r.id] = r; current = r.id; sel = null; pendingNew.add(r.id); touch(r); renderAll(); $('rName').focus(); $('rName').select(); };
let armed = false;
$('delRoom').onclick = async () => {
  const b = $('delRoom');
  if (!armed) { armed = true; b.classList.add('armed'); b.textContent = 'Click again to delete'; setTimeout(() => { armed = false; b.classList.remove('armed'); b.textContent = 'Delete room'; }, 3000); return; }
  armed = false; b.classList.remove('armed'); b.textContent = 'Delete room';
  const id = current; await removeRoom(id); current = Object.keys(rooms)[0] || null; if (!current) seedBlank(); sel = null; renderAll();
};

// ------------------------------------------------------------ brief for Claude
function yawOf(face) { const f = face * Math.PI / 180, vx = -Math.sin(f), vz = Math.cos(f); return Math.round(Math.atan2(-vx, -vz) * 180 / Math.PI); }
let scope = 'room';                       // brief covers just the open room, or every room
const scopeRooms = () => scope === 'room' && room() ? [room()] : Object.values(rooms);
function exportData() {
  return { format: 'room-planner/1', units: 'base units (rooms.py); witch ≈ 35 tall, 14 wide', facing: '0 = south, 90 = west, 180 = north, 270 = east',
    rooms: scopeRooms().map(r => ({ ...r, markers: r.markers.map(m => m.kind === 'camera' ? { ...m, yaw: yawOf(m.face || 0), tilt: HEIGHTS[m.height || 'medium'] } : m) })) };
}
function briefText() {
  const out = ['# Room plan for Claude', '', 'Units are base units as in prototype/rooms.py (the witch is about 35 tall and 14 wide). x runs east, z runs south, (0, 0) is the north-west corner.',
    'Facing: 0 = south (toward the camera side), 90 = west, 180 = north, 270 = east. Camera yaw/tilt are given in rooms.py terms.', ''];
  const where = m => `(${m.x}, ${m.z})`, face = m => m.face != null ? `, faces ${dirName(m.face)} (${m.face}°)` : '';
  const det = m => m.details ? `\n    ${m.details.replace(/\n/g, '\n    ')}` : '';
  if (scope === 'room') out.push('Only this room is included. Doors name the rooms they lead to.', '');
  for (const r of scopeRooms()) {
    out.push(`## ${r.name}  ·  id: ${r.id}`, `- Size: ${r.size[0]} × ${r.size[1]} (${r.setting === 'interior' ? 'indoors' : 'outdoors'}), edges: ${r.boundary}` + (r.floor ? `, floor: ${r.floor}` : ''));
    if (r.notes) out.push(`- Mood / notes: ${r.notes}`);
    const by = k => r.markers.filter(m => m.kind === k);
    const sec = (title, list, fmt) => { if (list.length) { out.push('', `### ${title}`); list.forEach(m => out.push(fmt(m))); } };
    sec('Player start', by('spawn'), m => `- ${m.label || 'Start'} at ${where(m)}${face(m)}${det(m)}`);
    sec('Doors and exits', by('door'), m => `- ${m.label || 'Door'} on the ${({ N: 'north', S: 'south', E: 'east', W: 'west' })[m.edge]} edge at ${m.edge === 'N' || m.edge === 'S' ? 'x ' + m.x : 'z ' + m.z}, ${m.width || 12} wide → ${m.to ? (rooms[m.to] ? rooms[m.to].name + ' (' + m.to + ')' : m.to) : 'not linked yet'}${det(m)}`);
    sec('Cameras', by('camera'), m => `- ${m.label || 'Camera'} at ${where(m)} looking ${dirName(m.face || 0)}: yaw ${yawOf(m.face || 0)}, tilt ${HEIGHTS[m.height || 'medium']} (${m.height || 'medium'} height)${det(m)}`);
    sec('NPCs', by('npc'), m => `- ${m.label || 'NPC'} at ${where(m)}${face(m)}, ${SIZES[m.size || 'M'].toLowerCase()}${det(m)}`);
    sec('Enemies', by('enemy'), m => `- ${m.label || 'Enemy'} at ${where(m)}${face(m)}, ${SIZES[m.size || 'M'].toLowerCase()}${det(m)}`);
    sec('Interactables', by('item'), m => `- ${m.label || 'Interactable'} at ${where(m)}${face(m)}, ${SIZES[m.size || 'M'].toLowerCase()}${det(m)}`);
    sec('Furniture', by('furniture'), m => `- ${m.label || 'Furniture'} at ${where(m)}${face(m)}, ${SIZES[m.size || 'M'].toLowerCase()}${det(m)}`);
    sec('Decorations', by('decoration'), m => `- ${m.label || 'Decoration'} at ${where(m)}${face(m)}, ${SIZES[m.size || 'M'].toLowerCase()}${det(m)}`);
    sec('Areas', by('area'), m => `- ${m.label || 'Area'}: x ${m.x}–${m.x + m.w}, z ${m.z}–${m.z + m.d}${det(m)}`);
    sec('Paths', by('path'), m => `- ${m.label || 'Path'}, ${m.width || 10} wide, through ${m.points.map(p => `(${p[0]}, ${p[1]})`).join(' → ')}${det(m)}`);
    sec('Notes', by('note'), m => `- At ${where(m)}: ${m.label || ''}${det(m)}`);
    out.push('', '');
  }
  return out.join('\n').trim() + '\n';
}
let fmt = 'text';
function fillBrief() {
  $('briefText').value = fmt === 'text' ? briefText() : JSON.stringify(exportData(), null, 2);
  const what = scope === 'room' && room() ? `“${room().name}”` : 'all your rooms';
  $('briefNote').textContent = mode === 'db'
    ? `This brief covers ${what}. Your rooms are already saved where Claude can read them, so you can also just ask Claude to build a room by name.`
    : `This brief covers ${what}. Copy it into your message to Claude, or save a file and add it to the repo.`;
}
$('briefBtn').onclick = () => { fillBrief(); $('briefDlg').showModal(); };
$('closeBrief').onclick = () => $('briefDlg').close();
$('briefScope').querySelectorAll('button').forEach(b => b.onclick = () => { scope = b.dataset.s; $('briefScope').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fillBrief(); });
$('briefFmt').querySelectorAll('button').forEach(b => b.onclick = () => { fmt = b.dataset.f; $('briefFmt').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fillBrief(); });
$('copyBtn').onclick = () => {
  const t = $('briefText'), done = () => { $('copyBtn').textContent = 'Copied'; setTimeout(() => $('copyBtn').textContent = 'Copy', 1500); };
  navigator.clipboard && navigator.clipboard.writeText(t.value).then(done, () => { t.focus(); t.select(); $('copyBtn').textContent = 'Press Ctrl+C'; })
    || (t.focus(), t.select());
};
$('exportBtn').onclick = async () => {
  const data = JSON.stringify(exportData(), null, 2), filename = (scope === 'room' && room() ? room().id : 'rooms') + '.plan.json';
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) { try { await dl.save({ filename, data }); } catch (e) {} return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename; a.click();
};
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const v = JSON.parse(await f.text());
    for (const r of v.rooms || []) { r.markers = (r.markers || []).map(m => { const { yaw, tilt, ...rest } = m; return rest; }); rooms[r.id] = r; current = r.id; touch(r); }
    $('briefNote').textContent = `Loaded ${(v.rooms || []).length} room(s).`; renderAll();
  } catch (err) { $('briefNote').textContent = 'That file isn’t a room plan. Save one from this page first.'; }
  e.target.value = '';
};

addEventListener('resize', () => { fit(); drawPlan(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawPlan);
new MutationObserver(drawPlan).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

loadLocal(); setTool('select'); renderTools(); renderAll(); connect();
})();
</script>
