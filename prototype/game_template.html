<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Witch RPG Prototype</title>
<style>
:root{--bg:#120f1f;--panel:#1e1934ee;--edge:#4a3f78;--text:#e6e0ff;--dim:#a79fd0;--accent:#b9a6ff;--mana:#6fb7ff;--gold:#e6b450}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
#wrap{position:relative;width:min(960px,100vw - 16px);aspect-ratio:960/600;margin:8px 8px 0}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:10px;background:#0c0a16}
.hud{position:absolute;pointer-events:none;font-size:clamp(11px,1.6vw,15px)}
#room{left:14px;top:10px;font-weight:600;letter-spacing:.04em;color:var(--accent);text-shadow:0 1px 2px #000}
#quest{right:14px;top:10px;max-width:42%;text-align:right;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:6px 10px}
#quest b{color:var(--gold);font-weight:600;display:block;font-size:.8em;letter-spacing:.08em;text-transform:uppercase}
#stats{left:14px;bottom:12px;display:flex;gap:10px;align-items:center;pointer-events:auto}
.bar{width:clamp(80px,14vw,140px);height:12px;border-radius:6px;background:#0008;border:1px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4e8ee0,var(--mana));transition:width .25s}
#spell{padding:3px 8px;border-radius:6px;border:1px solid var(--edge);background:var(--panel);color:var(--dim)}
#spell.on{color:#fff;border-color:var(--accent);box-shadow:0 0 8px #b9a6ff88}
#potion{cursor:pointer;padding:3px 8px;border-radius:6px;border:1px solid var(--edge);background:var(--panel);color:var(--text);font:inherit}
#potion:disabled{opacity:.4;cursor:default}
#label{position:absolute;pointer-events:none;background:#000c;color:#fff;padding:2px 8px;border-radius:5px;font-size:13px;white-space:nowrap;transform:translate(-50%,-140%);display:none}
#dialog{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(680px,92%);background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 14px 12px;display:none;cursor:pointer}
#dialog .who{color:var(--gold);font-weight:600;font-size:.85em;letter-spacing:.06em;text-transform:uppercase}
#dialog .more{float:right;color:var(--dim);font-size:.8em}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;border-radius:10px}
#help{color:var(--dim);font-size:13px;margin:8px 16px 16px;text-align:center}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
</style></head><body>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>
  <div class="hud" id="room"></div>
  <div class="hud" id="quest"><b>Objective</b><span id="obj"></span></div>
  <div class="hud" id="stats"><span>Mana</span><div class="bar"><i id="mana"></i></div><span id="spell">Spark</span><button id="potion" disabled>Potion ×0</button></div>
  <div id="label"></div>
  <div id="dialog"><div class="who" id="who"></div><div id="text"></div><span class="more">click ▸</span></div>
  <div id="fade"></div>
  <div id="loading">Loading…</div>
</div>
<div id="help">Click the ground to walk · double-click to run · click glowing or labelled things to interact · Space / click advances dialogue</div>
<script>
/*GAME_JS*/
</script>
<script>startGame(/*GAME_DATA*/null)</script>
</body></html>
