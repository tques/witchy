const c=document.getElementById('c'),x=c.getContext('2d');
const F={};let mode=A.walk?'walk':'stand',heading=0.6,px=0,pz=0,phase=0,drag=null,last=null,keys={},shiftRun=false;
let loaded=0;const names=Object.keys(A);
for(const name of names){const a=A[name],img=new Image();img.onload=()=>{F[name]=[];
 for(let f=0;f<a.n;f++){const L=[];for(let y=0;y<H;y++){const k=document.createElement('canvas');k.width=W;k.height=D;
  k.getContext('2d').drawImage(img,f*W,y*D,W,D,0,0,W,D);L.push(k)}F[name].push(L)}
 if(++loaded==names.length)requestAnimationFrame(tick)};img.src=a.src;
 const b=document.createElement('button');b.textContent=name;b.id='b_'+name;b.onclick=()=>setMode(name);modes.appendChild(b)}
let ret=null;                                                   // one-shot animations return here
function setMode(m){const a=A[m];if(!a.loop){ret=a.after&&A[a.after]?a.after:(A[mode].loop?mode:'stand')}
 mode=m;phase=0;for(const n of names)document.getElementById('b_'+n).className=n==m?'on':''}
setMode(mode);
const shots=names.filter(n=>!A[n].loop);
if(shots.length)help.textContent+=' · Space: '+shots[0].replace('_',' ');
c.onpointerdown=e=>{drag=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=null;
c.onpointermove=e=>{if(drag!==null){heading+=(e.clientX-drag)*0.01;drag=e.clientX}};
onkeydown=e=>{keys[e.key]=1;if(e.key==' '&&shots.length){e.preventDefault();setMode(shots[0])}if(e.key=='Shift'&&A.run&&mode!='run'){shiftRun=mode;setMode('run')}};
onkeyup=e=>{keys[e.key]=0;if(e.key=='Shift'&&shiftRun){setMode(shiftRun);shiftRun=false}};
function tick(now){const dt=last?Math.min((now-last)/1000,0.1):0;last=now;
 if(keys.ArrowLeft)heading-=2*dt;if(keys.ArrowRight)heading+=2*dt;
 const a=A[mode],adv=dt*a.fps*(+sp.value);phase+=adv;
 if(phase>=a.n){if(a.loop)phase%=a.n;else{setMode(ret||'stand');ret=null}}
 px+=-Math.sin(heading)*a.speed*adv;pz+=Math.cos(heading)*a.speed*adv;   // forward = the way she faces
 draw();requestAnimationFrame(tick)}
function draw(){const T=t.value*Math.PI/180,S=+z.value,cs=Math.cos(T),sn=Math.sin(T),n=Math.ceil(S*cs)+1;
 const co=Math.cos(heading),si=Math.sin(heading);
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#18142a';x.fillRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;
 const cx=c.width/2,base=c.height*0.78,G=12;
 x.fillStyle='#342c52';
 const ex=c.width/S/2+G,ez=c.height/(S*sn)+G;
 const gx0=Math.floor((px-ex)/G)*G,gz0=Math.floor((pz-ez)/G)*G;
 for(let gx=gx0;gx<px+ex;gx+=G)for(let gz=gz0;gz<pz+ez;gz+=G){const X=cx+S*(gx-px),Y=base+S*(gz-pz)*sn;x.fillRect(X-S*0.6,Y-S*0.4,S*1.2,S*0.8)}
 x.fillStyle='#100d1c';x.beginPath();x.ellipse(cx,base,S*9,S*9*sn,0,0,7);x.fill();
 const L=F[mode][Math.floor(phase)%A[mode].n];
 for(let y=H-1;y>=0;y--){const cy=base-(H-1-y)*S*cs;
  for(let k=0;k<n;k++){x.setTransform(S*co,S*si*sn,-S*si,S*co*sn,cx,cy-k*(S*cs)/n);x.drawImage(L[y],-W/2,-D/2)}}
 x.setTransform(1,0,0,1,0,0)}
